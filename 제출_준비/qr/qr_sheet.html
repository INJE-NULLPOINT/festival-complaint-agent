<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구역별 접수 QR</title>
<style>
  @page { size: A4; margin: 10mm; }
  body { font-family: "Malgun Gothic", sans-serif; margin: 0; color: #111; background: #fff; }
  header { text-align: center; margin: 4mm 0 6mm; }
  header h1 { font-size: 20pt; margin: 0; }
  header p { font-size: 11pt; margin: 2mm 0 0; }
  main { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; }
  figure { margin: 0; border: 1px dashed #888; padding: 3mm; text-align: center; break-inside: avoid; }
  img { width: 100%; height: auto; }
  figcaption b { display: block; font-size: 12pt; margin-top: 1mm; }
  figcaption span { display: block; font-size: 7pt; color: #444; word-break: break-all; }
  footer { font-size: 9pt; text-align: center; margin-top: 6mm; }
</style></head>
<body>
<header><h1>진주남강유등축제 불편 신고</h1>
<p>휴대폰 카메라로 찍어 불편한 점을 한 줄로 알려 주세요. 이름·연락처는 받지 않습니다.</p></header>
<main>
  <figure>
    <img src="qr_01.png" alt="진주교 남단 주차장 접수 QR">
    <figcaption><b>진주교 남단 주차장</b><span>http://192.168.0.24:5173/?v=qr&amp;zone=1</span></figcaption>
  </figure>
  <figure>
    <img src="qr_02.png" alt="촉석루 일원 접수 QR">

  </figure>
  <figure>
    <img src="qr_03.png" alt="남강 수상무대 접수 QR">
    <figcaption><b>남강 수상무대</b><span>http://192.168.0.24:5173/?v=qr&amp;zone=3</span></figcaption>
  </figure>
  <figure>
    <img src="qr_04.png" alt="유등터널 접수 QR">
    <figcaption><b>유등터널</b><span>http://192.168.0.24:5173/?v=qr&amp;zone=4</span></figcaption>
  </figure>
  <figure>
    <img src="qr_05.png" alt="먹거리장터 접수 QR">
    <figcaption><b>먹거리장터</b><span>http://192.168.0.24:5173/?v=qr&amp;zone=5</span></figcaption>
  </figure>
  <figure>
    <img src="qr_06.png" alt="소망등 달기 구역 접수 QR">
    <figcaption><b>소망등 달기 구역</b><span>http://192.168.0.24:5173/?v=qr&amp;zone=6</span></figcaption>

  <figure>
    <img src="qr_07.png" alt="임시 화장실 A 접수 QR">
    <figcaption><b>임시 화장실 A</b><span>http://192.168.0.24:5173/?v=qr&amp;zone=7</span></figcaption>
  </figure>
  <figure>
    <img src="qr_08.png" alt="셔틀버스 승강장 접수 QR">
    <figcaption><b>셔틀버스 승강장</b><span>http://192.168.0.24:5173/?v=qr&amp;zone=8</span></figcaption>
  </figure>
</main>
<footer>점선을 따라 잘라 구역마다 붙이세요 · 주소: http://192.168.0.24:5173</footer>
</body></html>
