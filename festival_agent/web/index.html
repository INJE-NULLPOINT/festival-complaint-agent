<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>축제 민원 관제</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 방문객(?v=qr)에는 관리자 뼈대(사이드바·햄버거·제목 줄)를 처음부터 숨긴다 — JS 가 늦거나 멈춰도 방문객에게 관리자 메뉴가 비치지 않게. (ES5 문법만)
      if (/[?&]v=qr(&|$)/.test(location.search)) document.documentElement.className += " v";
    </script>
  </head>
  <body>
    <aside class="side" id="side" aria-label="주 메뉴">
      <div class="side-brand">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l4-6 4 9 3-5 5 2"/></svg></span>
        <strong id="side-name">축제 민원 관제</strong>
      </div>
      <nav class="side-nav" id="tabs" aria-label="화면 선택">
        <p class="side-group">운영</p>
        <a href="#control" data-route="control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>관제</span></a>
        <a href="#action" data-route="action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="m9 14 2 2 4-4"/></svg><span>조치</span></a>
        <p class="side-group">도구</p>
        <a href="#settings" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>설정</span></a>
        <a href="#report" data-route="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M20 20h.01M17 20v-3"/></svg><span>접수 QR</span></a>
      </nav>
    </aside>
    <div class="side-scrim" id="side-scrim" hidden></div>
    <header class="top">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="메뉴 열기" aria-expanded="false" aria-controls="side"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <strong>축제 민원 관제</strong>
        <span class="live" id="live">연결 중</span>
        <span class="chip" id="chip-ai" hidden></span>
        <span class="chip warn" id="chip-syn" hidden></span>
        <span class="chip warn" id="chip-crowd" hidden></span>
      </div>
      <button type="button" class="dev-toggle" id="dev-toggle" role="switch" aria-checked="false" aria-controls="dev-panel" title="내부 AI 에이전트가 도는 모습을 봅니다">
        <span class="dev-sw" aria-hidden="true"></span><span>AI 동작 보기</span>
      </button>
    </header>
    <div class="page-head" id="page-head">
      <div class="page-title" id="page-title"></div>
      <div class="page-actions" id="page-actions"></div>
    </div>
    <!-- JS 가 못 돌 때의 안내 (D5-27). CSS 도 안 불러와졌을 수 있어 스타일은 인라인으로 둔다.
         구형 브라우저에서도 읽혀야 하므로 아래 스크립트는 ES5 문법만 쓴다. -->
    <div id="boot-msg" role="alert" hidden
         style="margin:16px;padding:14px 16px;border:2px solid #000;background:#fff;color:#000;font:16px/1.6 sans-serif">
      화면을 불러오지 못했습니다.<br />브라우저를 최신으로 업데이트하거나 Chrome 으로 열어 주세요.
    </div>
    <noscript>
      <div style="margin:16px;padding:14px 16px;border:2px solid #000;background:#fff;color:#000;font:16px/1.6 sans-serif">
        JavaScript 가 꺼져 있어 화면을 열 수 없습니다. 브라우저 설정에서 JavaScript 를 켜 주세요.
      </div>
    </noscript>
    <main id="app"></main>
    <div id="toasts" aria-live="polite"></div>
    <!-- type="module" 을 모르는 브라우저만 이 스크립트를 실행한다 -->
    <script nomodule>
      document.getElementById("boot-msg").hidden = false;
    </script>
    <script>
      // 모듈 스크립트가 문법 오류 등으로 중간에 멈추면 #app 이 끝내 비어 있다.
      // 몇 초 기다려도 비어 있을 때만 안내를 띄우고, 화면이 그려지면 다시 숨긴다.
      (function () {
        var msg = document.getElementById("boot-msg");
        var tries = 0;
        function drawn() {
          var app = document.getElementById("app");
          return !!(app && app.children.length);
        }
        var timer = setInterval(function () {
          tries += 1;
          if (drawn()) { msg.hidden = true; clearInterval(timer); return; }
          if (tries >= 8) msg.hidden = false;   // 약 8초
          if (tries >= 60) clearInterval(timer);
        }, 1000);
        // 스크립트 오류가 나면 8초를 기다리지 않고 바로 한 번 확인한다.
        // 파일을 못 받은 오류는 <script> 요소에서만 나고 위로 전달되지 않으므로 캡처 단계(true)로 듣는다.
        // 글꼴 CDN 이 안 열리는 것 같은 다른 리소스 오류에는 반응하지 않는다.
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t !== window && !(t && t.tagName === "SCRIPT")) return;
          setTimeout(function () { if (!drawn()) msg.hidden = false; }, 1500);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
